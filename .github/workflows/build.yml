name: Build und Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Qt needs an X server and a handful of system libraries on Linux; without
      # them every widget test fails with an unhelpful "could not load platform
      # plugin" rather than a real error.
      - name: Qt-Systemabhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libdbus-1-3 libfontconfig1 \
            fonts-dejavu-core xvfb

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests (Linux, unter Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python -m pytest -v

      - name: Tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -v

  build:
    name: Binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OpenReader-windows-x86_64
            binary: build/dist/OpenReader.exe
          - os: macos-latest
            artifact: OpenReader-macos-arm64
            binary: build/dist/OpenReader.app
          - os: ubuntu-22.04
            artifact: OpenReader-linux-x86_64
            binary: build/dist/OpenReader

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Building on the oldest supported Ubuntu is what makes the resulting
      # binary run on newer ones too: glibc is backwards compatible, not
      # forwards.
      - name: Qt-Systemabhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 \
            libfontconfig1 fonts-dejavu-core xvfb

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Symbol erzeugen
        run: python build/icon.py

      - name: Binary bauen
        run: >
          pyinstaller build/openreader.spec --noconfirm --clean
          --distpath build/dist --workpath build/work

      - name: Start prüfen (Windows)
        if: runner.os == 'Windows'
        run: |
          $out = & "build/dist/OpenReader.exe" --version
          if ($out -notmatch "OpenReader") { throw "Unerwartete Ausgabe: $out" }
          Write-Host $out

      - name: Start prüfen (macOS)
        if: runner.os == 'macOS'
        run: |
          ./build/dist/OpenReader.app/Contents/MacOS/OpenReader --version

      - name: Start prüfen (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build/dist/OpenReader
          xvfb-run -a ./build/dist/OpenReader --version

      - name: macOS-Archiv packen
        if: runner.os == 'macOS'
        run: |
          cd build/dist
          # ditto preserves the bundle's symlinks and permissions; zip does not.
          ditto -c -k --sequesterRsrc --keepParent OpenReader.app OpenReader-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/dist/OpenReader.exe
            build/dist/OpenReader
            build/dist/OpenReader-macos.zip
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Windows-Installer
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Symbol erzeugen
        run: python build/icon.py

      # The runner image ships Inno Setup 6; installing it again would only cost
      # time.  The fallback is there so a future image change does not silently
      # drop the installer from the release.
      - name: Inno Setup bereitstellen
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup ist im Runner-Abbild vorhanden."
          } else {
            Write-Host "Inno Setup fehlt im Abbild - wird nachinstalliert."
            choco install innosetup --no-progress -y
          }

      - name: Installer bauen
        run: python build/make_installer.py

      - name: Stille Installation prüfen
        run: |
          $setup = Get-ChildItem build/dist-installer/*-setup.exe | Select-Object -First 1
          $target = Join-Path $env:TEMP "OpenReaderCI"
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
            "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER",
            "/DIR=`"$target`"","/ASSOC=.epub,.cbz"
          if ($p.ExitCode -ne 0) { throw "Installation fehlgeschlagen: $($p.ExitCode)" }

          $exe = Join-Path $target "OpenReader.exe"
          if (-not (Test-Path $exe)) { throw "OpenReader.exe wurde nicht installiert." }
          $out = & $exe --version
          if ($out -notmatch "OpenReader") { throw "Unerwartete Ausgabe: $out" }

          $assoc = (Get-ItemProperty "HKCU:\Software\OpenReader" -Name Associations).Associations
          if ($assoc -ne ".epub;.cbz;") { throw "Falsche Verknüpfungen: $assoc" }
          Write-Host "Installiert, Version $out, Verknüpfungen $assoc"

          # An uninstall that leaves registry entries behind is a defect, so the
          # build checks for it rather than trusting the script.
          $u = Start-Process (Join-Path $target "unins000.exe") -Wait -PassThru `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          if ($u.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen: $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Programmdatei blieb nach der Deinstallation liegen." }
          if (Test-Path "HKCU:\Software\OpenReader") { throw "Registrierungsschlüssel blieb liegen." }
          $rest = @(Get-ChildItem "HKCU:\Software\Classes" |
                    Where-Object { $_.PSChildName -like "OpenReader.*" }).Count
          if ($rest -ne 0) { throw "$rest ProgID(s) blieben liegen." }
          Write-Host "Deinstallation restlos."

      - uses: actions/upload-artifact@v4
        with:
          name: OpenReader-windows-installer
          path: build/dist-installer/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release veröffentlichen
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefakte

      - name: Dateien benennen
        run: |
          set -euo pipefail
          mkdir -p release
          cp artefakte/OpenReader-windows-installer/*-setup.exe \
             release/OpenReader-${{ github.ref_name }}-windows-x86_64-setup.exe
          cp artefakte/OpenReader-windows-x86_64/OpenReader.exe \
             release/OpenReader-${{ github.ref_name }}-windows-x86_64.exe
          cp artefakte/OpenReader-linux-x86_64/OpenReader \
             release/OpenReader-${{ github.ref_name }}-linux-x86_64
          cp artefakte/OpenReader-macos-arm64/OpenReader-macos.zip \
             release/OpenReader-${{ github.ref_name }}-macos-arm64.zip

          # v1.0.0 shipped without the installer: the copy line was simply
          # missing, every remaining command succeeded, and the release went out
          # advertising a file that was not attached.  Nothing about a *missing*
          # step is detectable by "set -e", so the expected set is named here and
          # checked, and the job fails loudly rather than publishing a lie.
          for name in \
              "OpenReader-${{ github.ref_name }}-windows-x86_64-setup.exe" \
              "OpenReader-${{ github.ref_name }}-windows-x86_64.exe" \
              "OpenReader-${{ github.ref_name }}-macos-arm64.zip" \
              "OpenReader-${{ github.ref_name }}-linux-x86_64"; do
            if [ ! -s "release/$name" ]; then
              echo "::error::Release-Datei fehlt oder ist leer: $name"
              exit 1
            fi
          done

          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Eigenständige Programmdateien — kein Python nötig.

            Für Windows gibt es beides: den **Installer** mit frei wählbaren
            Dateiverknüpfungen, Startmenü-Eintrag und Deinstallation, oder die
            **portable Einzeldatei**, die ohne Installation von einem USB-Stick
            läuft. Der Installer startet schneller (kein Entpacken bei jedem
            Start), die Einzeldatei hinterlässt dafür keine Spuren.

            | Plattform | Datei |
            |---|---|
            | Windows 10/11 (x64), Installer | `OpenReader-${{ github.ref_name }}-windows-x86_64-setup.exe` |
            | Windows 10/11 (x64), portabel | `OpenReader-${{ github.ref_name }}-windows-x86_64.exe` |
            | macOS (Apple Silicon) | `OpenReader-${{ github.ref_name }}-macos-arm64.zip` |
            | Linux (x64, glibc ≥ 2.35) | `OpenReader-${{ github.ref_name }}-linux-x86_64` |

            Prüfsummen stehen in `SHA256SUMS.txt`, die Änderungen in
            [CHANGELOG.md](CHANGELOG.md).

            **Windows:** Die Dateien sind nicht signiert, daher meldet sich
            SmartScreen beim ersten Start. Über „Weitere Informationen →
            Trotzdem ausführen“ geht es weiter; die Prüfsumme in
            `SHA256SUMS.txt` belegt, dass die Datei unverändert ist.

            **macOS:** Das Bundle ist nicht signiert. Beim ersten Start
            Rechtsklick → „Öffnen“, oder einmalig
            `xattr -dr com.apple.quarantine OpenReader.app`.

            **Linux:** `chmod +x` nicht vergessen.
