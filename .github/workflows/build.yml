name: Build und Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm: the only place the ARM64 build is ever exercised --
        # nobody on the project owns such a machine.
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Qt needs an X server and a handful of system libraries on Linux; without
      # them every widget test fails with an unhelpful "could not load platform
      # plugin" rather than a real error.
      - name: Qt-Systemabhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libdbus-1-3 libfontconfig1 \
            fonts-dejavu-core xvfb

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # brotli, one of py7zr's dependencies, has no build for Windows on ARM,
      # and py7zr loads fine without it: only a 7z archive packed with Brotli
      # -- rare for comics -- then fails with a clear message. So
      # requirements-dev skips py7zr on ARM64 and this installs it with every
      # dependency but that one.
      - name: py7zr ohne brotli (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          pip install --no-deps "py7zr>=0.21"
          pip install texttable "pycryptodomex>=3.20.0" psutil "pyppmd>=1.3.1" "pybcj>=1.0.6" "multivolumefile>=0.2.3" "inflate64>=1.0.4" "backports.zstd>=1.0.0"

      - name: Tests (Linux, unter Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python -m pytest -v

      - name: Tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -v

  build:
    name: Binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Lectern-windows-x86_64
            binary: build/dist/Lectern.exe
          - os: macos-latest
            artifact: Lectern-macos-arm64
            binary: build/dist/Lectern.app
          - os: ubuntu-22.04
            artifact: Lectern-linux-x86_64
            binary: build/dist/Lectern
          # PyInstaller freezes the interpreter it runs under, so an ARM64
          # program needs an ARM64 runner; there is no cross-building.
          - os: windows-11-arm
            artifact: Lectern-windows-arm64
            binary: build/dist/Lectern.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Building on the oldest supported Ubuntu is what makes the resulting
      # binary run on newer ones too: glibc is backwards compatible, not
      # forwards.
      - name: Qt-Systemabhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 \
            libfontconfig1 fonts-dejavu-core xvfb

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # brotli, one of py7zr's dependencies, has no build for Windows on ARM,
      # and py7zr loads fine without it: only a 7z archive packed with Brotli
      # -- rare for comics -- then fails with a clear message. So
      # requirements-dev skips py7zr on ARM64 and this installs it with every
      # dependency but that one.
      - name: py7zr ohne brotli (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          pip install --no-deps "py7zr>=0.21"
          pip install texttable "pycryptodomex>=3.20.0" psutil "pyppmd>=1.3.1" "pybcj>=1.0.6" "multivolumefile>=0.2.3" "inflate64>=1.0.4" "backports.zstd>=1.0.0"

      - name: Symbol erzeugen
        run: python build/icon.py

      - name: Binary bauen
        run: >
          pyinstaller build/lectern.spec --noconfirm --clean
          --distpath build/dist --workpath build/work

      - name: Start prüfen (Windows)
        if: runner.os == 'Windows'
        run: |
          $out = & "build/dist/Lectern.exe" --version
          if ($out -notmatch "Lectern") { throw "Unerwartete Ausgabe: $out" }
          Write-Host $out

      - name: Start prüfen (macOS)
        if: runner.os == 'macOS'
        run: |
          ./build/dist/Lectern.app/Contents/MacOS/Lectern --version

      - name: Start prüfen (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build/dist/Lectern
          xvfb-run -a ./build/dist/Lectern --version

      - name: macOS-Archiv packen
        if: runner.os == 'macOS'
        run: |
          cd build/dist
          # ditto preserves the bundle's symlinks and permissions; zip does not.
          ditto -c -k --sequesterRsrc --keepParent Lectern.app Lectern-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/dist/Lectern.exe
            build/dist/Lectern
            build/dist/Lectern-macos.zip
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Windows-Installer (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # brotli, one of py7zr's dependencies, has no build for Windows on ARM,
      # and py7zr loads fine without it: only a 7z archive packed with Brotli
      # -- rare for comics -- then fails with a clear message. So
      # requirements-dev skips py7zr on ARM64 and this installs it with every
      # dependency but that one.
      - name: py7zr ohne brotli (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          pip install --no-deps "py7zr>=0.21"
          pip install texttable "pycryptodomex>=3.20.0" psutil "pyppmd>=1.3.1" "pybcj>=1.0.6" "multivolumefile>=0.2.3" "inflate64>=1.0.4" "backports.zstd>=1.0.0"

      - name: Symbol erzeugen
        run: python build/icon.py

      # The runner image ships Inno Setup 6; installing it again would only cost
      # time.  The fallback is there so a future image change does not silently
      # drop the installer from the release.
      - name: Inno Setup bereitstellen
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup ist im Runner-Abbild vorhanden."
          } else {
            Write-Host "Inno Setup fehlt im Abbild - wird nachinstalliert."
            choco install innosetup --no-progress -y
          }

      - name: Installer bauen
        run: python build/make_installer.py

      - name: Stille Installation prüfen
        run: |
          $setup = Get-ChildItem build/dist-installer/*-setup.exe | Select-Object -First 1
          # Pretend an installation from before the rename exists, because that
          # is the update every existing user will run: its file type as the
          # default for .epub, its "Open with" entry, its default-apps entry
          # and its remembered choice.
          $classes = "HKCU:\Software\Classes"
          New-Item "$classes\OpenReader.epub\shell\open\command" -Force | Out-Null
          New-Item "$classes\.epub\OpenWithProgids" -Force | Out-Null
          New-ItemProperty "$classes\.epub\OpenWithProgids" -Name "OpenReader.epub" -Value "" -Force | Out-Null
          Set-Item "$classes\.epub" -Value "OpenReader.epub"
          New-Item "HKCU:\Software\OpenReader" -Force | Out-Null
          New-ItemProperty "HKCU:\Software\OpenReader" -Name Associations -Value ".epub;.cbz;" -Force | Out-Null
          New-Item "HKCU:\Software\RegisteredApplications" -Force | Out-Null
          New-ItemProperty "HKCU:\Software\RegisteredApplications" -Name "OpenReader" -Value "Software\OpenReader\Capabilities" -Force | Out-Null

          $target = Join-Path $env:TEMP "LecternCI"
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
            "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER",
            "/DIR=`"$target`""
          if ($p.ExitCode -ne 0) { throw "Installation fehlgeschlagen: $($p.ExitCode)" }

          $exe = Join-Path $target "Lectern.exe"
          if (-not (Test-Path $exe)) { throw "Lectern.exe wurde nicht installiert." }
          $out = & $exe --version
          if ($out -notmatch "Lectern") { throw "Unerwartete Ausgabe: $out" }

          # The licence texts have to arrive next to the program, not just
          # inside the bundle: v1.1.0 shipped four binaries without one.
          foreach ($licence in "GPL-3.0.txt", "LGPL-3.0.txt") {
            $path = Join-Path $target "licenses\$licence"
            if (-not (Test-Path $path)) { throw "Lizenztext fehlt: $licence" }
          }

          $assoc = (Get-ItemProperty "HKCU:\Software\Lectern" -Name Associations).Associations
          if ($assoc -ne ".epub;.cbz;") { throw "Auswahl nicht übernommen: $assoc" }

          # The old registration must be gone, not merely outnumbered.
          if (Test-Path "HKCU:\Software\OpenReader") { throw "Alter Registrierungszweig blieb liegen." }
          if (Test-Path "$classes\OpenReader.epub") { throw "Alte ProgID blieb liegen." }
          $owp = Get-ItemProperty "$classes\.epub\OpenWithProgids" -ErrorAction SilentlyContinue
          if ($owp -and ($owp.PSObject.Properties.Name -contains "OpenReader.epub")) { throw "Alter Öffnen-mit-Eintrag blieb liegen." }
          $apps = Get-ItemProperty "HKCU:\Software\RegisteredApplications" -ErrorAction SilentlyContinue
          if ($apps -and ($apps.PSObject.Properties.Name -contains "OpenReader")) { throw "Alter Standard-Apps-Eintrag blieb liegen." }
          # The default handler passes to the new name -- unless the machine
          # itself registers one for .epub, in which case nobody may take it.
          $machine = (Get-ItemProperty "HKLM:\Software\Classes\.epub" -ErrorAction SilentlyContinue).'(default)'
          $default = (Get-ItemProperty "$classes\.epub" -ErrorAction SilentlyContinue).'(default)'
          if (-not $machine -and $default -ne "Lectern.epub") { throw "Standard für .epub ging nicht über: $default" }
          Write-Host "Installiert, Version $out, Verknüpfungen $assoc"

          # An uninstall that leaves registry entries behind is a defect, so the
          # build checks for it rather than trusting the script.
          $u = Start-Process (Join-Path $target "unins000.exe") -Wait -PassThru `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          if ($u.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen: $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Programmdatei blieb nach der Deinstallation liegen." }
          if (Test-Path "HKCU:\Software\Lectern") { throw "Registrierungsschlüssel blieb liegen." }
          $rest = @(Get-ChildItem "HKCU:\Software\Classes" |
                    Where-Object { $_.PSChildName -like "Lectern.*" }).Count
          if ($rest -ne 0) { throw "$rest ProgID(s) blieben liegen." }
          Write-Host "Deinstallation restlos."

      - uses: actions/upload-artifact@v4
        with:
          name: Lectern-windows-installer-${{ matrix.arch }}
          path: build/dist-installer/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release veröffentlichen
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefakte

      - name: Dateien benennen
        run: |
          set -euo pipefail
          mkdir -p release
          cp artefakte/Lectern-windows-installer-x86_64/*-setup.exe \
             release/Lectern-${{ github.ref_name }}-windows-x86_64-setup.exe
          cp artefakte/Lectern-windows-installer-arm64/*-setup.exe \
             release/Lectern-${{ github.ref_name }}-windows-arm64-setup.exe
          cp artefakte/Lectern-windows-arm64/Lectern.exe \
             release/Lectern-${{ github.ref_name }}-windows-arm64.exe
          cp artefakte/Lectern-windows-x86_64/Lectern.exe \
             release/Lectern-${{ github.ref_name }}-windows-x86_64.exe
          cp artefakte/Lectern-linux-x86_64/Lectern \
             release/Lectern-${{ github.ref_name }}-linux-x86_64
          cp artefakte/Lectern-macos-arm64/Lectern-macos.zip \
             release/Lectern-${{ github.ref_name }}-macos-arm64.zip

          # v1.0.0 shipped without the installer: the copy line was simply
          # missing, every remaining command succeeded, and the release went out
          # advertising a file that was not attached.  Nothing about a *missing*
          # step is detectable by "set -e", so the expected set is named here and
          # checked, and the job fails loudly rather than publishing a lie.
          for name in \
              "Lectern-${{ github.ref_name }}-windows-x86_64-setup.exe" \
              "Lectern-${{ github.ref_name }}-windows-x86_64.exe" \
              "Lectern-${{ github.ref_name }}-windows-arm64-setup.exe" \
              "Lectern-${{ github.ref_name }}-windows-arm64.exe" \
              "Lectern-${{ github.ref_name }}-macos-arm64.zip" \
              "Lectern-${{ github.ref_name }}-linux-x86_64"; do
            if [ ! -s "release/$name" ]; then
              echo "::error::Release-Datei fehlt oder ist leer: $name"
              exit 1
            fi
          done

          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Eigenständige Programmdateien — kein Python nötig.

            Für Windows gibt es beides: den **Installer** mit frei wählbaren
            Dateiverknüpfungen, Startmenü-Eintrag und Deinstallation, oder die
            **portable Einzeldatei**, die ohne Installation von einem USB-Stick
            läuft. Der Installer startet schneller (kein Entpacken bei jedem
            Start), die Einzeldatei hinterlässt dafür keine Spuren.

            | Plattform | Datei |
            |---|---|
            | Windows 10/11 (x64), Installer | `Lectern-${{ github.ref_name }}-windows-x86_64-setup.exe` |
            | Windows 10/11 (x64), portabel | `Lectern-${{ github.ref_name }}-windows-x86_64.exe` |
            | Windows 11 auf ARM, Installer | `Lectern-${{ github.ref_name }}-windows-arm64-setup.exe` |
            | Windows 11 auf ARM, portabel | `Lectern-${{ github.ref_name }}-windows-arm64.exe` |
            | macOS (Apple Silicon) | `Lectern-${{ github.ref_name }}-macos-arm64.zip` |
            | Linux (x64, glibc ≥ 2.35) | `Lectern-${{ github.ref_name }}-linux-x86_64` |

            Prüfsummen stehen in `SHA256SUMS.txt`, die Änderungen in
            [CHANGELOG.md](CHANGELOG.md).

            **Windows:** Die Dateien sind nicht signiert, daher meldet sich
            SmartScreen beim ersten Start. Über „Weitere Informationen →
            Trotzdem ausführen“ geht es weiter; die Prüfsumme in
            `SHA256SUMS.txt` belegt, dass die Datei unverändert ist.

            **macOS:** Das Bundle ist nicht signiert. Beim ersten Start
            Rechtsklick → „Öffnen“, oder einmalig
            `xattr -dr com.apple.quarantine Lectern.app`.

            **Linux:** `chmod +x` nicht vergessen.
