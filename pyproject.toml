[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openreader"
version = "1.1.1"
description = "Free e-book reader for EPUB, Kindle formats, FB2, PDF, comics, text, Markdown, HTML and RTF"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["ebook", "reader", "epub", "mobi", "azw3", "fb2", "pdf", "cbz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "PySide6-Essentials>=6.7",
    "PySide6-Addons>=6.7",
]

[project.urls]
Homepage = "https://github.com/nylarus90/OpenReader"
Repository = "https://github.com/nylarus90/OpenReader"
Changelog = "https://github.com/nylarus90/OpenReader/blob/main/CHANGELOG.md"
Issues = "https://github.com/nylarus90/OpenReader/issues"

[project.optional-dependencies]
cb7 = ["py7zr>=0.21"]
dev = ["pytest>=8.0", "pyinstaller>=6.11", "py7zr>=0.21"]

[project.gui-scripts]
openreader = "openreader.app:main"

[tool.setuptools.packages.find]
include = ["openreader*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Backup snapshots written by the editor are not part of the project.
exclude = ["_versions", ".venv", "build/dist", "build/work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter setting above
    "N802",    # Qt overrides such as resizeEvent must keep their names
    "N815",    # Qt signals are camelCase by convention
    "UP031",   # this codebase uses %-formatting consistently
    "UP035",   # typing.Callable is still correct and reads better here
    "SIM905",  # a wrapped sentence beats a 66-item word list
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115"]
